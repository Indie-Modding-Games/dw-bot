name: CI/CD — test y deploy (Cloudflare Workers)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un deploy a la vez.
concurrency:
  group: devbot-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test (typecheck, lint, vitest, worker typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (bot local)
        run: npm run typecheck

      - name: Typecheck (worker Cloudflare)
        run: npm run typecheck:worker

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  deploy:
    name: Deploy worker a Cloudflare
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Sin wrangler-action: instalar wrangler puede fallar segun el runner;
      # el repo ya fija wrangler como devDependency, lo usamos directo.
      # Wrangler lee credenciales de CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID.
      - name: Instalar dependencias
        run: npm ci

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
