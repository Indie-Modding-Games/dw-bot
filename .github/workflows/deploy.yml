name: CI/CD — test y deploy (Cloudflare Workers)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un deploy a la vez.
concurrency:
  group: devbot-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test (typecheck, lint, vitest, worker typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (bot local)
        run: npm run typecheck

      - name: Typecheck (worker Cloudflare)
        run: npm run typecheck:worker

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  deploy:
    name: Deploy worker a Cloudflare
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Wrangler deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
